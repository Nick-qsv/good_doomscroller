services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: doomscroller
      POSTGRES_USER: doomscroller
      POSTGRES_PASSWORD: doomscroller
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doomscroller -d doomscroller"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_URL: postgresql://doomscroller:doomscroller@database:5432/doomscroller
      ACTOR_COOKIE_SECRET: local-development-secret-change-before-deployment
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
