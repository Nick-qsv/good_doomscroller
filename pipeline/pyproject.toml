[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "good-doomscroller-pipeline"
version = "0.2.0"
description = "Deterministic public-domain book ingestion and passage curation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.109.0,<3"]
dev = ["jsonschema>=4.23,<5", "pytest>=8.3,<10", "ruff>=0.9,<1"]

[project.scripts]
good-doomscroll = "good_doomscroller_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/good_doomscroller_pipeline"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
