name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install pipeline
        run: python -m pip install -e './pipeline[dev,openai]'
      - name: Lint pipeline
        run: python -m ruff check pipeline
      - name: Test pipeline
        run: python -m pytest pipeline/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint web application
        working-directory: apps/web
        run: npm run lint
      - name: Test web application
        working-directory: apps/web
        run: npm test
      - name: Build web application
        working-directory: apps/web
        run: npm run build

  anchoring:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/anchoring/package-lock.json
      - name: Install anchoring dependencies
        run: npm ci --prefix packages/anchoring
      - name: Audit production anchoring dependencies
        run: npm audit --prefix packages/anchoring --omit=dev --audit-level=high
      - name: Test anchoring and database recovery
        env:
          ANCHOR_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm test --prefix packages/anchoring
